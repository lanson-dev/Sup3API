<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="AGraphs — 连接 AI 生成能力，让文字与图像成为三维资产。">
  <title>AGraphs — 从想象，到三维</title>
  <link rel="icon" href="/agraphs-mark.svg" type="image/svg+xml">
  <style>
    :root { --paper: #f6f7f2; --ink: #20251f; --muted: #777c71; --line: #dce0d4; --accent: #d3f36b; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
    ::selection { background: var(--accent); color: var(--ink); text-shadow: none; }
    .page { max-width: 1480px; min-height: 100svh; margin: auto; padding: 0 6.2%; display: flex; flex-direction: column; }
    header { height: 108px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 27px; letter-spacing: -1.4px; font-weight: 650; }
    .brand svg { width: 30px; height: 30px; }
    nav { display: flex; align-items: center; gap: 34px; font-size: 13px; }
    nav a { transition: opacity .2s; }
    nav a:hover { opacity: .55; }
    .nav-console { display: flex; gap: 15px; align-items: center; }
    .arrow { display: inline-block; font-size: 19px; font-weight: 400; }
    main { flex: 1; display: flex; align-items: center; min-height: 610px; }
    .hero { width: 100%; display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 24px; padding: 58px 0; }
    .eyebrow { display: flex; align-items: center; gap: 10px; font-family: Consolas, monospace; font-size: 11px; letter-spacing: 2px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #7d982f; box-shadow: 0 0 0 4px #e9efd9; }
    h1 { margin: 30px 0 25px; font-size: clamp(45px, 5.3vw, 76px); letter-spacing: -.065em; font-weight: 550; line-height: 1.28; }
    h1 span { color: #87907f; }
    .intro { max-width: 370px; color: var(--muted); font-size: 15px; line-height: 1.95; margin: 0; }
    .actions { display: flex; gap: 26px; align-items: center; margin: 35px 0 48px; }
    .primary { display: inline-flex; justify-content: center; align-items: center; gap: 30px; min-height: 52px; padding: 0 22px; background: var(--ink); color: #fff; border-radius: 4px; font-size: 13px; transition: background .2s, transform .2s; }
    .primary:hover { background: #3c4931; transform: translateY(-2px); }
    .secondary { font-size: 13px; padding: 12px 0; border-bottom: 1px solid #c5cbbb; }
    .providers { display: flex; align-items: center; flex-wrap: wrap; gap: 13px; font-size: 10px; letter-spacing: .15em; color: #999e91; }
    .providers strong { font-size: 13px; letter-spacing: -.3px; color: #626957; font-weight: 550; }
    .provider-line { width: 19px; height: 1px; background: #b9c0af; margin: 0 3px; }
    .visual { width: 100%; max-width: 550px; position: relative; margin: 0; justify-self: end; }
    .visual:before { content: ''; position: absolute; inset: 8% 3% 14%; border-radius: 50%; background: radial-gradient(ellipse, #eaf0dd 0%, #f6f7f200 69%); pointer-events: none; }
    .mesh { width: 100%; aspect-ratio: 1 / 1; display: block; position: relative; overflow: visible; }
    .visual-label { display: flex; justify-content: space-between; margin: 4px 22px 0; font-family: Consolas, monospace; font-size: 10px; letter-spacing: 1.4px; color: #8c9381; }
    .visual-label span:last-child { display: inline-flex; align-items: center; gap: 8px; }
    .visual-label span:last-child:before { content: ''; width: 5px; height: 5px; background: #9aaa6f; border-radius: 50%; }
    .capabilities { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 25px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .capability-label { font-family: Consolas, monospace; font-size: 10px; letter-spacing: 1.5px; color: #8c9381; }
    .capability-list { display: flex; flex-wrap: wrap; gap: 26px; font-size: 12px; color: #565e4e; }
    .capability-list span { display: flex; gap: 8px; align-items: center; }
    .capability-list svg { width: 15px; height: 15px; color: #8f9a80; }
    footer { min-height: 83px; display: flex; justify-content: space-between; align-items: center; gap: 20px; color: #91978a; font-size: 10px; letter-spacing: .04em; }
    .footer-note { display: flex; align-items: center; gap: 10px; }
    .footer-note span { width: 22px; height: 1px; background: #c7cebc; }
    @media (min-width: 1600px) { .page { padding: 0 92px; } }
    @media (max-width: 780px) {
      .page { padding: 0 7%; }
      header { height: 82px; }
      .brand { font-size: 24px; }
      nav { gap: 15px; font-size: 11px; }
      main { min-height: 0; }
      .hero { grid-template-columns: 1fr; gap: 12px; padding: 49px 0 32px; }
      h1 { font-size: clamp(46px, 8.5vw, 65px); margin: 25px 0 22px; }
      .intro { max-width: 390px; font-size: 14px; }
      .actions { margin: 28px 0 33px; }
      .visual { max-width: 410px; justify-self: center; margin-top: 12px; }
      .capabilities { align-items: flex-start; flex-direction: column; gap: 18px; padding: 23px 0; }
      .capability-list { gap: 15px 25px; font-size: 11px; }
      footer { font-size: 9px; min-height: 75px; }
    }
    @media (max-width: 380px) { .nav-docs { display: none; } .actions { gap: 21px; } .primary { gap: 23px; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } a { transition: none !important; } }
  </style>
</head>
